# QA before going live (plan section 5, checklist I6). Runs on pull requests and is called by
# pages.yml, so nothing is deployed while a job fails.
name: QA
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  # Weekly link check: job ads and articles expire; a dead link shows red here without blocking a deploy.
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  static:
    name: Build, dist, HTML, privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check-dist
      - run: npm run validate-html
      - run: npm run check-privacy

  e2e:
    name: Browsers, layout, accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse (score >= 90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.16.0 autorun

  links:
    name: Links
    runs-on: ubuntu-latest
    # On a deploy (push to main) a dead external link is reported, not blocking;
    # on pull requests, manual and weekly runs it fails the run.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      # 403 and 429: some job boards block automated clients; the link itself still works for people.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --exclude-loopback --accept 200..=299,403,429 'src/data/*.json' README.md
          fail: true
